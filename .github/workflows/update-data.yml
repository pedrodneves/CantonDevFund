name: Update Dev Fund data

on:
  schedule:
    - cron: "0 * * * *"       # top of every hour (UTC)
  workflow_dispatch: {}        # manual "Run workflow" button too

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---- Financials (data.json): committed from GitHub, disbursed from Lighthouse ----
      - name: Rebuild data.json from the dev fund repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -f data.new.json          # never reuse a stale temp file
          python3 scripts/build_data.py --out data.new.json
          echo "--- data.json summary ---"
          python3 - <<'PY'
          import json
          d = json.load(open("data.new.json"))
          print("generated_at:", d.get("generated_at"))
          print("disbursement_source:", d.get("disbursement_source"))
          print("committed:", f"{d.get('headline_committed',0):,.0f}")
          print("disbursed:", f"{d.get('headline_disbursed',0):,.0f}")
          print("n_tx:", d.get("n_tx"))
          PY

      - name: Validate data.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys
          d = json.load(open("data.new.json"))
          n = len(d.get("grants", []))
          if n == 0:
              print("::error::generator produced 0 grants"); sys.exit(1)
          if not d.get("disbursement_source"):
              print("::error::data is not from the Lighthouse generator "
                    "(no disbursement_source) - refusing to commit"); sys.exit(1)
          print(f"OK: {n} grants, {d.get('n_tx',0)} payments, "
                f"disbursed {d.get('headline_disbursed',0):,.0f}")
          PY

      # ---- Votes (votes.json): GitVote tallies from PRs + milestone issues ----
      - name: Rebuild votes.json from the dev fund repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -f votes.new.json
          python3 scripts/build_votes.py --out votes.new.json
          echo "--- votes.json summary ---"
          python3 - <<'PY'
          import json
          d = json.load(open("votes.new.json"))
          print("generated_at:", d.get("generated_at"))
          print("total:", d.get("n_votes"),
                "| in progress:", d.get("n_in_progress"),
                "| passed:", d.get("n_passed"),
                "| failed:", d.get("n_failed"))
          PY

      - name: Validate votes.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys
          d = json.load(open("votes.new.json"))
          if "votes" not in d:
              print("::error::votes.json has no 'votes' key"); sys.exit(1)
          print(f"OK: {d.get('n_votes',0)} votes")
          PY

      # ---- Commit whichever of the two files actually changed ----
      - name: Commit if changed
        run: |
          set -euo pipefail
          mv data.new.json data.json
          mv votes.new.json votes.json
          if git diff --quiet -- data.json votes.json; then
            echo "::warning::no changes to data.json or votes.json - nothing committed."
            exit 0
          fi
          git config user.name  "devfund-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json votes.json
          git commit -m "chore(data): refresh dev fund data + votes ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
          echo "Committed and pushed updated data.json / votes.json."
