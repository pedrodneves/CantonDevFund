name: Update Dev Fund data (PAUSED)

# PAUSED while the generator is being fixed. The hourly schedule is disabled so
# it cannot overwrite the known-good data.json. Re-enable by uncommenting the
# schedule block once build_data.py is verified against the live repo.
on:
  # schedule:
  #   - cron: "0 * * * *"
  workflow_dispatch: {}   # manual runs only, for testing

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild data.json from the dev fund repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/build_data.py --out data.new.json
      - name: Validate generated data
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys
          d = json.load(open("data.new.json"))
          n = len(d.get("grants", []))
          if n == 0:
              print("::error::generator produced 0 grants"); sys.exit(1)
          print(f"OK: {n} grants, {d.get('n_tx',0)} payments")
          PY
      - name: Commit if changed
        run: |
          set -euo pipefail
          mv data.new.json data.json
          if git diff --quiet -- data.json; then echo "No changes."; exit 0; fi
          git config user.name  "devfund-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git commit -m "chore(data): refresh dev fund data ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
